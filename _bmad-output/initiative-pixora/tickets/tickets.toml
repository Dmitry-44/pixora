[[epic]]
id = 1
slug = "epic-text-to-image"
title = "Пользователь получает картинку по тексту"
description = "Платформа (монорепо, compose, полная схема generations из spine, миграции, локальный запуск одной командой, прокси для Telegram из конфига) и конвейер submit→poll→deliver на advance() работают на локальном стеке: пользователь из белого списка шлёт текст, сразу получает «принято», затем изображение ответом (больше лимита фото — файлом); /start и не-текст отвечают подсказкой; одно сообщение — не больше одной генерации. R4: задача, прерванная рестартом, подхватывается очередью и доводит генерацию до исхода. R7: любая ошибка Polza или Telegram без повторов и опрос дольше 10 минут завершают генерацию текстом «сервис временно недоступен». R10: JSON-логи с generationId и очередью. На этом конвейере эпик 2 строит повторы и точные тексты, эпик 3 — деплой на VPS."
covers = ["R1", "R2", "R3", "R4", "R5", "R7", "R8", "R10", "R11"]

[[epic]]
id = 2
slug = "epic-fault-tolerance"
title = "Сбои Polza и рестарты не теряют запросы"
description = "Поверх конвейера эпика 1 на локальном стеке: R6 — временные ошибки Polza и Telegram повторяются с конечным бюджетом (MAX_ATTEMPTS, Retry-After). R7 — окончательные ошибки дают точный текст по failure_reason, каждый запрос завершается не позже 30 минут, ошибки собственного кода идут через dead letter к сообщению пользователю. R4 — корректное завершение bot и worker по SIGTERM и живая демонстрация рестарта bot, worker и postgres посреди генерации. R10 — в логах attempts, failure_reason и trace_id Polza, 402 и ошибки конфигурации уровнем error. Эпик строит внедрение ошибок Polza за интерфейсом libs/polza для демонстрации и приводит портфолио-документ к реализованной системе."
covers = ["R4", "R6", "R7", "R10"]
after = [{ epic = 1, needs = "конвейер submit→poll→deliver на advance() с состоянием failed и доставкой текста ошибки, запущенный в локальном compose" }]

[[epic]]
id = 3
slug = "epic-vps-deploy"
title = "Бот работает на VPS"
description = "Тот же compose-файл эпика 1 запущен на VPS вне РФ: секреты в .env на сервере, сервисы поднимаются сами после перезагрузки, доступ к Polza и Telegram с VPS проверен; друзья пользуются ботом без локальной машины автора."
covers = ["R9"]
after = [{ epic = 1, needs = "compose-файл со всеми сервисами и конфиг только из env" }, { epic = 2, needs = "конфиг отказоустойчивости (бюджет повторов, дедлайны, завершение по SIGTERM), проверенный на локальном стеке" }]
