[[epic]]
id = 1
slug = "epic-text-to-image"
title = "Друзья получают картинку по тексту в проде"
description = "Платформа (монорепо, compose, полная схема generations из spine, миграции, деплой на VPS) и конвейер submit→poll→deliver на advance() работают в проде: пользователь из белого списка шлёт текст, сразу получает «принято», затем изображение ответом (больше лимита фото — файлом); /start и не-текст отвечают подсказкой; одно сообщение — не больше одной генерации. R4: задача, прерванная рестартом, подхватывается очередью и доводит генерацию до исхода. R7: любая ошибка Polza или Telegram без повторов и опрос дольше 10 минут завершают генерацию текстом «сервис временно недоступен». R10: JSON-логи с generationId и очередью. На этом конвейере эпик 2 строит повторы и точные тексты."
covers = ["R1", "R2", "R3", "R4", "R5", "R7", "R8", "R9", "R10"]

[[epic]]
id = 2
slug = "epic-fault-tolerance"
title = "Сбои Polza и рестарты не теряют запросы"
description = "Поверх конвейера и прод-деплоя эпика 1: R6 — временные ошибки Polza и Telegram повторяются с конечным бюджетом (MAX_ATTEMPTS, Retry-After). R7 — окончательные ошибки дают точный текст по failure_reason, каждый запрос завершается не позже 30 минут, ошибки собственного кода идут через dead letter к сообщению пользователю. R4 — корректное завершение bot и worker по SIGTERM и живая демонстрация рестарта bot, worker и postgres посреди генерации на проде. R10 — в логах attempts, failure_reason и trace_id Polza, 402 и ошибки конфигурации уровнем error. Эпик строит внедрение ошибок Polza за интерфейсом libs/polza для демонстрации и приводит портфолио-документ к реализованной системе."
covers = ["R4", "R6", "R7", "R10"]
after = [{ epic = 1, needs = "конвейер submit→poll→deliver на advance() с состоянием failed и доставкой текста ошибки, задеплоенный на VPS" }]
